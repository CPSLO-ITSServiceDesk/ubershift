name: UberShift CI

# run CI on pushes to main 
# run CI on pull requests
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    # temporary Linux machine to run the checks
    runs-on: ubuntu-latest

    steps:
      # checks out repo onto that machine
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...